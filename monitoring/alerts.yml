groups:
  - name: iha-alarmlari
    rules:
      - alert: GPSJamming
        expr: drone_gps_jamming_alarm == 1
        for: 5s
        labels:
          severity: critical
        annotations:
          summary: "GPS jamming şüphesi ({{ $labels.drone_id }})"
          description: "Uydu sayısı düştü ya da fix kaybedildi."

      - alert: DonanimAnomalisi
        expr: drone_anomaly_score > 1
        for: 5s
        labels:
          severity: critical
        annotations:
          summary: "Motor/batarya anomalisi şüphesi ({{ $labels.drone_id }})"
          description: 'Model skoru {{ $value | printf "%.1f" }} (sınır 1.0). Motor ya da batarya değerleri normal uçuştan sapıyor.'